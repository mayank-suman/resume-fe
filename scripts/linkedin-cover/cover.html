<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LinkedIn Cover</title>
<style>
  @font-face {
    font-family: 'Bricolage';
    src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2') format('woff2-variations');
    font-weight: 200 800; font-stretch: 75% 100%;
  }
  @font-face {
    font-family: 'Newsreader';
    src: url('../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-standard-italic.woff2') format('woff2-variations');
    font-weight: 200 800; font-style: italic;
  }
  :root {
    --paper: #0d201c; --ink: #e2ebe5; --ink-soft: #9ab4aa; --contour: #2f544a; --sun: #f2b33d;
  }
  :root[data-theme='light'] {
    --paper: #edf1ec; --ink: #0f2e29; --ink-soft: #4a675e; --contour: #b4c5ba; --mark: 55%;
  }
  html, body { margin: 0; }
  body { width: 1584px; height: 396px; background: var(--paper); color: var(--ink); overflow: hidden; }
  .cover { position: relative; width: 1584px; height: 396px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy {
    position: absolute; left: 676px; right: 96px; top: 62px; bottom: 50px;
    display: flex; flex-direction: column;
    font-family: 'Bricolage', sans-serif;
  }
  .meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 16px; font-weight: 580; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-soft); font-variation-settings: 'opsz' 14;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sun); flex: none; }
  h1 {
    margin: 22px 0 0; font-weight: 720; font-stretch: 78%; font-size: 70px; line-height: 0.98;
    letter-spacing: -0.025em; font-variation-settings: 'opsz' 96;
  }
  h1 em {
    font-family: 'Newsreader', serif; font-style: italic; font-weight: 420; letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 72;
    background: linear-gradient(transparent 72%, color-mix(in oklab, var(--sun) var(--mark, 78%), transparent) 72% 90%, transparent 90%);
    padding: 0 2px;
  }
  .foot {
    margin-top: auto; padding-top: 16px; border-top: 1px solid color-mix(in oklab, var(--ink) 18%, transparent);
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 19px; font-weight: 500; color: var(--ink-soft); font-variation-settings: 'opsz' 18;
  }
  .foot b { color: var(--ink); font-weight: 650; letter-spacing: 0.01em; }
  .foot i { font-style: normal; color: var(--sun); padding: 0 8px; }
</style>
</head>
<body>
<div class="cover">
  <canvas id="field" width="3168" height="792"></canvas>
  <div class="copy">
    <div class="meta"><span class="dot"></span>Senior Software Developer, Frontend <span aria-hidden="true">·</span> Vancouver, BC</div>
    <h1>Turning product ideas into<br><em>fast, accessible</em> interfaces.</h1>
    <div class="foot">
      <span>React<i>/</i>TypeScript<i>/</i>Next.js<i>/</i>React Native</span>
      <b>mayanksuman.dev</b>
    </div>
  </div>
</div>
<script>
  const theme = new URLSearchParams(location.search).get('theme') || 'dark';
  document.documentElement.dataset.theme = theme;

  // Same height field and isoline rendering as packages/portfolio/src/scripts/contour.ts,
  // frozen at one frame with the "hill" parked above where LinkedIn's avatar sits.
  const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uHill; uniform float uDpr;
uniform vec3 uLine; uniform vec3 uAccent; uniform vec3 uPaper;
vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
float fbm(vec2 p) { float v = 0.0; float a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * snoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = vec2(uv.x * aspect, uv.y) * 0.62;
  float t = uTime * 0.03;
  float h = fbm(p + vec2(t, -t * 0.7)) + 0.35 * snoise(p * 0.45 - t * 0.5);
  vec2 m = vec2(uMouse.x * aspect, uMouse.y) * 0.62;
  float d = distance(p, m);
  float hill = uHill * exp(-d * d * 9.0);
  h += hill * 0.85;
  float v = h * 9.0;
  float fw = max(fwidth(v), 1e-4);
  float level = floor(v + 0.5);
  float px = abs(v - level) / fw;
  bool major = mod(level, 5.0) == 0.0;
  float width = (major ? 1.25 : 0.7) * uDpr;
  float line = 1.0 - smoothstep(width - 0.6, width + 0.6, px);
  // Full strength on the left, receding behind the copy on the right.
  float fieldMask = mix(1.0, 0.32, smoothstep(0.30, 0.50, uv.x));
  float heat = smoothstep(0.08, 0.55, hill);
  vec3 color = mix(uLine, uAccent, heat);
  float alpha = line * (major ? 1.0 : 0.7) * fieldMask;
  alpha = mix(alpha, line * mix(1.0, 0.6, smoothstep(0.30, 0.50, uv.x)), heat);
  outColor = vec4(mix(uPaper, color, alpha), 1.0);
}`;
  const VERT = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
  const hex = (s) => { const n = parseInt(s.trim().slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };

  const canvas = document.getElementById('field');
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const u = (n) => gl.getUniformLocation(prog, n);
  const css = getComputedStyle(document.documentElement);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(u('uRes'), canvas.width, canvas.height);
  gl.uniform1f(u('uDpr'), 2);
  gl.uniform1f(u('uTime'), Number(new URLSearchParams(location.search).get('t') || 11));
  gl.uniform2f(u('uMouse'), 0.27, 0.70);
  gl.uniform1f(u('uHill'), 1.0);
  gl.uniform3fv(u('uLine'), hex(css.getPropertyValue('--contour')));
  gl.uniform3fv(u('uAccent'), hex(css.getPropertyValue('--sun')));
  gl.uniform3fv(u('uPaper'), hex(css.getPropertyValue('--paper')));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
